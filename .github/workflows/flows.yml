name: refresh-flows

# Fund flows (#21): once a day, read tracked fund tokens' mints and burns from the free
# SQD Portal into build/state/flows-ledger.json. Separate from refresh-rwa so a slow
# Portal never delays the snapshot; the next refresh puts the ledger on the page.
on:
  schedule:
    - cron: "40 4 * * *" # daily, between the 12-hourly refreshes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh # same group as refresh-rwa: the two never push at the same time
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # the first run backfills 30 days on the free, rate-limited Portal
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read flows from SQD Portal
        run: node build/flows-run.mjs

      - name: Commit ledger if changed
        run: |
          git config user.name "rwa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # the job writes the file only once it has read something
          [ -f build/state/flows-ledger.json ] || { echo "::warning::no flows ledger written yet"; exit 0; }
          git add build/state/flows-ledger.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh flows ledger ($(date -u +%FT%TZ))"
            git pull --rebase origin main && git push
          fi
