name: refresh-rwa

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build data snapshot
        run: node build/build.mjs

      - name: Commit snapshot if changed
        run: |
          git config user.name "rwa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/latest.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh RWA snapshot ($(date -u +%FT%TZ))"
            git push
          fi
